<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جيران | قهوة مختصة — المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6EADA; --cream-deep:#ECDFC5; --maroon:#5A2A1E; --maroon-deep:#3E1D14;
    --sage:#5C7454; --ink:#2C2015; --ink-soft:#7A6E56; --line:rgba(90,42,30,.18);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#1B1310; --cream-deep:#241914; --maroon:#D98C6E; --maroon-deep:#E8A98C;
      --sage:#8FB185; --ink:#EFE3D0; --ink-soft:#B7A88E; --line:rgba(239,227,208,.16);
    }
  }
  :root[data-theme="dark"]{
    --cream:#1B1310; --cream-deep:#241914; --maroon:#D98C6E; --maroon-deep:#E8A98C;
    --sage:#8FB185; --ink:#EFE3D0; --ink-soft:#B7A88E; --line:rgba(239,227,208,.16);
  }
  html{scroll-padding-top:130px; scroll-behavior:smooth;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Tajawal',system-ui,-apple-system,sans-serif;
    min-height:100%;
  }
  a{color:inherit;}
  .diamond{color:var(--maroon); font-size:.55em; opacity:.85; flex:0 0 auto;}

  header{
    position:sticky; top:0; z-index:20; background:var(--cream);
    padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; flex-direction:column; align-items:center; gap:2px; margin-bottom:12px;}
  .brand img{width:58px; height:58px; border-radius:50%; box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .brand .tagline{
    font-family:'Cormorant Garamond',serif; letter-spacing:.35em; font-size:11px;
    color:var(--maroon); text-transform:uppercase; margin-top:4px;
  }
  .searchwrap{position:relative; max-width:480px; margin:0 auto;}
  #search{
    width:100%; padding:10px 40px 10px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--cream-deep); color:var(--ink); font-family:'Tajawal',sans-serif; font-size:14px;
    outline:none;
  }
  #search::placeholder{color:var(--ink-soft);}
  .searchwrap svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); opacity:.55;}

  nav.cats{
    display:flex; gap:8px; overflow-x:auto; margin-top:10px; padding-bottom:2px;
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{display:none;}
  nav.cats button{
    flex:0 0 auto; border:1px solid var(--line); background:transparent; color:var(--ink);
    font-family:'Tajawal',sans-serif; font-size:13px; font-weight:500; padding:7px 16px;
    border-radius:999px; cursor:pointer; white-space:nowrap; transition:.2s;
  }
  nav.cats button.active{background:var(--maroon); color:var(--cream); border-color:var(--maroon);}

  main{max-width:640px; margin:0 auto; padding:18px 18px 10px;}
  section.cat{margin-bottom:34px; scroll-margin-top:128px;}
  .cat-head{text-align:center; margin-bottom:16px;}
  .cat-head .ar{
    font-family:'Aref Ruqaa',serif; font-weight:700; font-size:30px; color:var(--sage); margin:0;
    letter-spacing:1px;
  }
  .cat-head .en{
    font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; letter-spacing:.3em;
    color:var(--maroon); text-transform:uppercase; margin:2px 0 0;
  }
  .items{display:flex; flex-direction:column;}
  .item{
    display:flex; align-items:baseline; gap:10px; padding:10px 2px;
    border-bottom:1px dashed var(--line);
  }
  .item:last-child{border-bottom:none;}
  .names{display:flex; flex-direction:column; flex:1 1 auto; text-align:right;}
  .names .ar{font-size:15.5px; font-weight:500;}
  .names .en{font-size:10.5px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; margin-top:1px;}
  .price{
    flex:0 0 auto; font-weight:700; font-size:15px; color:var(--ink);
    display:flex; align-items:baseline; gap:3px; direction:ltr;
  }
  .price .sar{font-size:10px; font-weight:500; color:var(--maroon);}

  .empty{text-align:center; color:var(--ink-soft); padding:40px 0; font-size:14px; display:none;}

  footer{
    border-top:1px solid var(--line); margin-top:10px; padding:26px 18px calc(env(safe-area-inset-bottom,0px) + 26px);
    text-align:center;
  }
  footer .social{display:flex; justify-content:center; gap:18px; margin-bottom:16px;}
  footer .social a{opacity:.85;}
  footer .loc{font-size:13px; color:var(--ink-soft); line-height:1.9;}
  footer .loc a{color:var(--maroon); text-decoration:none; font-weight:500;}
  footer .credit{font-family:'Aref Ruqaa',serif; color:var(--maroon); font-size:15px; margin-top:16px; opacity:.75;}
</style>
</head>

  const section = document.createElement('section');
  section.className = 'cat';
  section.id = 'cat-'+cat.id;
  section.innerHTML = `
    <div class="cat-head">
      <p class="ar">${cat.ar}</p>
      <p class="en">${cat.en}</p>
    </div>
    <div class="items">
      ${cat.items.map(([ar,en,price])=>`
        <div class="item" data-ar="${ar}" data-en="${en.toLowerCase()}">
          <span class="names"><span class="ar">${ar}</span><span class="en">${en}</span></span>
          <span class="diamond">◆</span>
          <span class="price">${price}<span class="sar">ر.س</span></span>
        </div>`).join('')}
    </div>`;
  main.appendChild(section);
});

// search filter
const search = document.getElementById('search');
const emptyMsg = document.getElementById('emptyMsg');
search.addEventListener('input', ()=>{
  const q = search.value.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('section.cat').forEach(sec=>{
    let catHas = false;
    sec.querySelectorAll('.item').forEach(it=>{
      const match = !q || it.dataset.ar.includes(q) || it.dataset.en.includes(q);
      it.style.display = match ? '' : 'none';
      if(match) catHas = true;
    });
    sec.style.display = catHas ? '' : 'none';
    if(catHas) anyVisible = true;
  });
  emptyMsg.style.display = anyVisible ? 'none' : 'block';
});

// scroll-spy nav highlight
const sections = [...document.querySelectorAll('section.cat')];
const navBtns = [...nav.querySelectorAll('button')];
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      navBtns.forEach(b=>b.classList.toggle('active', b.dataset.target === e.target.id));
    }
  });
}, {rootMargin:'-140px 0px -70% 0px', threshold:0});
sections.forEach(s=>io.observe(s));
if(navBtns[0]) navBtns[0].classList.add('active');

// maps link
document.getElementById('mapLink').href =
  'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('جيران قهوة مختصة، النعمان بن مالك، حي أوس، المدينة المنورة');
</script>
